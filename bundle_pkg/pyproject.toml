[project]
name = "s3-archive-dag-bundle"
version = "0.1.0"
description = "Proof of concept: stage an Airflow DAG bundle from a single S3 archive object instead of one request per file"
requires-python = ">=3.10"
dependencies = ["apache-airflow-providers-amazon>=9.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
