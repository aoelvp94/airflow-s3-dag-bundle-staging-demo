services:
  minio:
    # minio/minio and minio/mc were removed from Docker Hub. Silo is
    # MinIO-compatible and still publishes minio_s3_requests_total.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - airflow
