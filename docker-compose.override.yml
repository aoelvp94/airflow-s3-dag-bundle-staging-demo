services:
  minio:
    # minio/minio was removed from Docker Hub. Silo is a MinIO-compatible server
    # and still exposes minio_s3_requests_total, which the benchmark diffs.
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - airflow
